name: CI

# Runs on every Pull Request targeting main, and on pushes to development
# branches so feedback is available before a PR is even opened.
on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - "feature/**"
      - "fix/**"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only - this validates the image compiles correctly.
      # The image is NOT pushed to any registry from CI; publishing only
      # happens from the release workflow, triggered by a version tag.
      - name: Build Docker image (validation only)
        run: docker build -t student-ml-api:ci-check .
