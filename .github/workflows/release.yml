name: Release

# Runs only when a semantic-version tag (vX.Y.Z) is pushed - never on a PR
# and never on an ordinary push to main. This is what separates the CI
# workflow (validates every PR) from the release workflow (publishes an
# artifact only for an intentionally cut version).
on:
  push:
    tags:
      - "v*.*.*"

# Needed so GITHUB_TOKEN (below) is allowed to push to GHCR - no personal
# access token or manually stored password required.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/<owner>/student-ml-api

jobs:
  release:
    name: Test, Build, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      # Derives "1.0.0" from the pushed tag "v1.0.0" - the version is never
      # hard-coded in this workflow, only read from the Git tag that
      # triggered it.
      - name: Derive application version from Git tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Derive short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record build date
        id: date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the image once and pushes it under three tags: the semantic
      # version, "latest", and the commit SHA it was built from (Part 24).
      # OCI labels (Part 23) embed the version/commit/repo/build-date so
      # `docker inspect` can trace any image back to the exact source that
      # produced it.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.short }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.date.outputs.value }}
